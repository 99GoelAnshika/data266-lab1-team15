experiment:
  name: anshika_char_gpt_v1
  member_name: Anshika Goel
  team_number: 15
  task: Task 1 - GPT-Style LLM From Scratch

data:
  dataset_id: roneneldan/TinyStories
  source_split: train
  text_field: text
  train_sequences: 100000
  validation_sequences: 10000
  sequence_length: 256
  split_seed: 2661501
  separator: "\n\n"
  cache_dir: task1_llm/data/hf_cache
  raw_dir: task1_llm/data/raw
  vocabulary_file: task1_llm/Anshika_Goel/outputs/metrics/vocabulary.json
  split_manifest_file: task1_llm/Anshika_Goel/outputs/metrics/split_manifest.json

model:
  tokenization: character
  d_model: 240
  num_heads: 6
  num_layers: 5
  d_ff: 960
  dropout: 0.10
  use_bias: true
  layer_norm_epsilon: 1.0e-5
  tie_token_and_output_embeddings: true
  positional_embeddings: learned
  normalization: pre_layer_norm

training:
  epochs: 10
  batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  minimum_learning_rate: 3.0e-5
  warmup_ratio: 0.05
  scheduler: cosine
  weight_decay: 0.10
  adam_beta1: 0.90
  adam_beta2: 0.95
  gradient_clip_norm: 1.0
  mixed_precision: true
  num_workers: 0
  training_seed: 20260924
  log_every_steps: 50
  save_best_and_last_checkpoints: true

generation:
  max_new_characters: 500
  temperatures:
    - 0.7
    - 1.0
    - 1.3
  samples_per_temperature: 3
  include_greedy_sample: true
  prompts:
    - "Once upon a time"
    - "Lily found a little"
    - "One day, a small dog"

evaluation:
  report_training_loss: true
  report_validation_loss: true
  report_perplexity: true
  report_bits_per_character: true
  report_generalization_gap: true
  report_top1_accuracy: true
  report_distinct_1_2_3: true
  report_repeated_4gram_rate: true
  report_gradient_norms: true
  report_parameter_count: true
  report_training_tokens_per_second: true
  report_generation_tokens_per_second: true
  report_peak_memory: true
  report_total_training_time: true