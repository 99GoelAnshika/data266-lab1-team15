protocol:
  name: task2_sentiment_final_evaluation
  version: 1
  status: frozen_before_official_test_access
  purpose: >
    Common final evaluation protocol for the baseline mean-pool,
    TextCNN, and BiGRU-attention sentiment classifiers.

provenance:
  training_config_file: task2_sentiment/Anshika_Goel/configs/sentiment.yaml
  training_config_sha256: 07f59eeb49af2fbdcce4f301e76625ac2c4ae8150eb1b89ef55862b6b5c9758b
  vocabulary_file: task2_sentiment/Anshika_Goel/outputs/metrics/vocabulary.json
  vocabulary_sha256: 0d06c4dc3a6df1ae90b86ec6726a0cafb81fe9eab32da75fa74b395258729124
  split_manifest_file: task2_sentiment/Anshika_Goel/outputs/metrics/split_manifest.json
  split_manifest_sha256: c782f45fb20eec7e3d12b1197baa346daeb5cb4b6adabf81d4cf5bf09584c28c

official_test_policy:
  split: official_yelp_polarity_test
  expected_examples: 38000
  used_for_training: false
  used_for_validation: false
  used_for_model_selection: false
  used_for_threshold_selection: false
  used_for_slice_threshold_selection: false
  decision_threshold_locked_before_test: 0.5
  evaluate_all_three_models_on_identical_rows: true

models:
  - baseline_mean_pool
  - textcnn
  - bigru_attention

classification:
  decision_threshold: 0.5
  positive_label: 1
  negative_label: 0

metrics:
  classification:
    - accuracy
    - precision_macro
    - precision_micro
    - precision_weighted
    - recall_macro
    - recall_micro
    - recall_weighted
    - f1_macro
    - f1_micro
    - f1_weighted
    - mcc
  ranking:
    - roc_auc
    - pr_auc
  calibration:
    - brier_score
    - ece
  confusion_matrix: true

calibration:
  ece_bins: 15

bootstrap:
  enabled: true
  replicates: 2000
  confidence_level: 0.95
  seed: 2662502
  resample_unit: example
  sampling: with_replacement
  replicate_sample_size: full_official_test_size
  metrics:
    - accuracy
    - macro_f1
    - mcc

paired_significance:
  test: mcnemar
  continuity_correction: true
  comparisons:
    - baseline_mean_pool_vs_textcnn
    - baseline_mean_pool_vs_bigru_attention
  multiple_testing:
    method: holm
    enabled: true
    family_size: 2

robustness_slices:
  derivation_split: training_only
  derivation_examples: 504000
  encoded_sequence_length: 256
  pad_index: 0
  unknown_index: 1

  length_definition: >
    Effective encoded length equals the number of non-PAD positions
    in the fixed-length encoded sequence.

  short_reviews:
    rule: effective_length <= 26
    threshold: 26
    threshold_source: training_effective_length_q25
    quantile: 0.25
    quantile_method: higher
    training_count: 132112
    training_fraction: 0.26212698412698415

  medium_reviews:
    rule: 26 < effective_length <= 86
    lower_exclusive: 26
    upper_inclusive: 86
    threshold_source: training_effective_length_q25_to_q75
    quantile_method: higher
    training_count: 246783
    training_fraction: 0.4896488095238095

  long_reviews:
    rule: effective_length > 86
    threshold: 86
    threshold_source: training_effective_length_q75
    quantile: 0.75
    quantile_method: higher
    training_count: 125105
    training_fraction: 0.24822420634920636

  contains_negation:
    rule: >
      At least one encoded position equals the vocabulary index of
      no, nor, not, or never.
    token_ids:
      "no": 15
      nor: 966
      not: 2
      never: 33
    training_count: 372945
    training_fraction: 0.7399702380952381

  high_oov_rate:
    rule: oov_rate >= 0.02666666666666667
    threshold: 0.02666666666666667
    threshold_source: training_per_review_oov_rate_q95
    quantile: 0.95
    quantile_method: higher
    oov_rate_definition: >
      Number of UNK positions divided by effective encoded length.
    training_count: 25315
    training_fraction: 0.0502281746031746

manual_error_analysis:
  confident_probability_threshold: 0.9
  near_threshold_margin: 0.05
  examples_per_category: 5
  categories:
    - confident_false_positive
    - confident_false_negative
    - near_threshold_error
    - slice_specific_failure

final_evaluation_outputs:
  metrics_json: task2_sentiment/Anshika_Goel/outputs/metrics/final_test_metrics.json
  bootstrap_json: task2_sentiment/Anshika_Goel/outputs/metrics/bootstrap_confidence_intervals.json
  mcnemar_json: task2_sentiment/Anshika_Goel/outputs/metrics/mcnemar_tests.json
  slice_metrics_json: task2_sentiment/Anshika_Goel/outputs/metrics/robustness_slice_metrics.json
  predictions_csv: task2_sentiment/Anshika_Goel/outputs/predictions/final_test_predictions.csv
