experiment:
  name: anshika_yelp_sentiment_v1
  member_name: Anshika Goel
  team_number: 15
  task: Yelp Polarity sentiment classification
data:
  dataset_name: fancyzhx/yelp_polarity
  dataset_config: plain_text
  dataset_revision: bbf1c97a1f0cf005e5aded43839fd814654a1557
  source_train_split: train
  source_test_split: test
  source_train_examples: 560000
  source_test_examples: 38000
  validation_fraction: 0.1
  split_seed: 2662501
  vocabulary_size: 50000
  minimum_token_frequency: 2
  sequence_length: 256
  pad_token: <PAD>
  unknown_token: <UNK>
  pad_index: 0
  unknown_index: 1
  processed_dir: task2_sentiment/data/processed/Anshika_Goel
  vocabulary_file: task2_sentiment/Anshika_Goel/outputs/metrics/vocabulary.json
  split_manifest_file: task2_sentiment/Anshika_Goel/outputs/metrics/split_manifest.json
preprocessing:
  lowercase: true
  normalize_html: true
  normalize_whitespace: true
  expand_negation_contractions: true
  remove_punctuation: true
  remove_special_characters: true
  remove_stopwords: true
  preserved_negations:
  - 'no'
  - nor
  - not
  - never
  stemming: porter
  tokenization: regex_word_tokens
training:
  training_seed: 20260924
  num_workers: 0
  mixed_precision: true
  gradient_clip_norm: 1.0
  warmup_ratio: 0.05
  minimum_learning_rate: 1.0e-05
  early_stopping_patience: 2
  decision_threshold: 0.5
models:
  baseline_mean_pool:
    architecture: learned_embedding_masked_mean_linear
    embedding_dimension: 128
    dropout: 0.2
    batch_size: 512
    maximum_epochs: 5
    learning_rate: 0.001
    weight_decay: 0.0001
  textcnn:
    architecture: learned_embedding_multikernel_textcnn
    embedding_dimension: 128
    kernel_sizes:
    - 3
    - 4
    - 5
    filters_per_kernel: 128
    dropout: 0.5
    batch_size: 256
    maximum_epochs: 5
    learning_rate: 0.001
    weight_decay: 0.0001
  bigru_attention:
    architecture: learned_embedding_bidirectional_gru_attention
    embedding_dimension: 128
    hidden_dimension: 128
    recurrent_layers: 1
    bidirectional: true
    attention_dimension: 128
    dropout: 0.3
    batch_size: 128
    maximum_epochs: 5
    learning_rate: 0.0005
    weight_decay: 0.0001
evaluation:
  ece_bins: 15
  bootstrap_replicates: 2000
  bootstrap_confidence_level: 0.95
  bootstrap_seed: 2662502
  mcnemar_continuity_correction: true
  mcnemar_holm_correction: true
  confident_probability_threshold: 0.9
  near_threshold_margin: 0.05
  manual_errors_per_category: 5
  manual_error_categories:
  - confident_false_positive
  - confident_false_negative
  - near_threshold_error
  - slice_specific_failure
  robustness_slices:
  - short_reviews
  - medium_reviews
  - long_reviews
  - contains_negation
  - high_oov_rate
